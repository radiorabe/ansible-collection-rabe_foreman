---
foreman_hostgroup:
  name: vm-0029.service.int.rabe.ch
  description: AlmaLinux 9 VM for ownCloud
  parent: RaBe Core/RaBe Base/EL9/AlmaLinux 9/AlmaLinux 9 VMs
  organization: RaBe
  locations:
    - Sulgenrain
  ansible_roles:
    - radiorabe.common.selinux_modules
    - redhat.rhel_system_roles.certificate
    - radiorabe.common.local_user
    - redhat.rhel_system_roles.kernel_settings
    - radiorabe.common.files
    - redhat.rhel_system_roles.podman
    - radiorabe.podman.zabbix_monitoring
  parameters:
    - name: certificate_requests
      parameter_type: yaml
      value:
        - name: owncloud
          dns:
            - owncloud.service.int.rabe.ch
          ca: ipa
          principal: HTTP/owncloud.service.int.rabe.ch@INT.RABE.CH
          key_size: 4096
          owner: "{{ '{{' }} podman_run_as_user {{ '}}' }}"
          group: "{{ '{{' }} podman_run_as_group {{ '}}' }}"
    - name: radiorabe_files
      parameter_type: yaml
      value:
        - path: /home/owncloud/owncloud/
          owner: "{{ '{{' }} podman_run_as_user {{ '}}' }}"
          group: "{{ '{{' }} podman_run_as_group {{ '}}' }}"
          mode: '0755'
          state: directory
          recurse: true
    - name: owncloud_db_password
      parameter_type: string
      value: "{{ '{{' }} undef('variable owncloud_db_password needs to be set in host') {{ '}}' }}"
    - name: owncloud_db_user
      parameter_type: string
      value: "{{ '{{' }} undef('variable owncloud_db_user needs to be set in host') {{ '}}' }}"
    - name: owncloud_mail_smtp_hostname
      parameter_type: string
      value: "{{ '{{' }} undef('variable owncloud_mail_smtp_hostname needs to be set in host') {{ '}}' }}"
    - name: owncloud_mail_smtp_password
      parameter_type: string
      value: "{{ '{{' }} undef('variable owncloud_mail_smtp_password needs to be set in host') {{ '}}' }}"
    - name: owncloud_mail_smtp_username
      parameter_type: string
      value: "{{ '{{' }} undef('variable owncloud_mail_smtp_username needs to be set in host') {{ '}}' }}"
    - name: owncloud_oidc_client_id
      parameter_type: string
      value: "{{ '{{' }} undef('variable owncloud_oidc_client_id needs to be set in host') {{ '}}' }}"
    - name: owncloud_oidc_client_secret
      parameter_type: string
      value: "{{ '{{' }} undef('variable owncloud_oidc_client_secret needs to be set in host') {{ '}}' }}"
    - name: kernel_settings_sysctl
      parameter_type: yaml
      value:
        - name: net.ipv4.ip_unprivileged_port_start
          value: 80
    - name: local_user_username
      parameter_type: string
      value: owncloud
    - name: podman_containers_conf
      parameter_type: yaml
      value:
        containers:
          log_driver: k8s-file
          log_size_max: 1073741824
        network:
          default_rootless_network_cmd: pasta
    - name: podman_create_host_directories
      parameter_type: boolean
      value: true
    - name: podman_firewall
      parameter_type: yaml
      value:
        - service:
            - http
            - https
          state: enabled
    - name: podman_kube_specs
      parameter_type: yaml
      value:
        - state: started
          kube_file_content:
            apiVersion: v1
            kind: Pod
            metadata:
              name: owncloud
            spec:
              containers:
                - name: httpd
                  image: ghcr.io/radiorabe/httpd:0.6.7@sha256:905ed132d1bdb9c32d2424203df79d215076a660c111f566490c84a56138f37d
                  ports:
                    - containerPort: 8081
                      hostPort: 80
                    - containerPort: 8444
                      hostPort: 443
                  volumeMounts:
                    - mountPath: /etc/pki/tls/certs/server.crt:ro
                      name: httpd_tls_cert
                    - mountPath: /etc/pki/tls/private/server.key:ro
                      name: httpd_tls_key
                    - mountPath: /etc/httpd/conf.d/local_configs:Z
                      name: local_httpd_configs
                  # Temporary workaround to fix the issue with httpd image not
                  # starting due to port conflicts. This will be removed once
                  # the upstream image is fixed.
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      sed -i s/8080/8081/ /etc/httpd/conf/httpd.conf
                      sed -i s/8443/8444/ /etc/httpd/conf.d/ssl.conf
                      /usr/bin/run-httpd
                - name: redis
                  image: docker.io/valkey/valkey:9-alpine
                  restart: always
                - name: owncloud
                  restart: always
                  image: docker.io/owncloud/server:10.16.0
                  volumeMounts:
                    - mountPath: /mnt/data:Z
                      name: owncloud_data
                  env:
                    - name: OWNCLOUD_ADMIN_USERNAME
                      value: "admin"
                    - name: OWNCLOUD_ADMIN_PASSWORD
                      value: "admin"
                    - name: OWNCLOUD_TRUSTED_DOMAINS
                      value: "vm-0029.service.int.rabe.ch,vm-0028.service.int.rabe.ch,share.rabe.ch,onlyoffice.rabe.ch"
                    - name: OWNCLOUD_TRUSTED_PROXIES
                      value: "10.133.36.23,10.133.0.2,10.133.0.3"
                    - name: OWNCLOUD_OVERWRITE_CLI_URL
                      value: "https://vm-0029.service.int.rabe.ch"
                    - name: OWNCLOUD_HTACCESS_REWRITE_BASE
                      value: "/"
                    - name: OWNCLOUD_DEFAULT_LANGUAGE
                      value: "de"
                    - name: OWNCLOUD_LOST_PASSWORD_LINK
                      value: "https://my.rabe.ch/auth/forgotpw"
                    - name: OWNCLOUD_DB_TYPE
                      value: "pgsql"
                    - name: OWNCLOUD_DB_NAME
                      value: "{{ '{{' }} owncloud_db_name {{ '}}' }}"
                    - name: OWNCLOUD_DB_HOST
                      value: "{{ '{{' }} owncloud_db_host {{ '}}' }}"
                    - name: OWNCLOUD_DB_TABLE_PREFIX
                      value: "oc_"
                    - name: OWNCLOUD_DB_USERNAME
                      value: "{{ '{{' }} owncloud_db_username {{ '}}' }}"
                    - name: OWNCLOUD_DB_PASSWORD
                      value: "{{ '{{' }} owncloud_db_password {{ '}}' }}"
                    - name: OWNCLOUD_REDIS_ENABLED
                      value: "true"
                    - name: OWNCLOUD_REDIS_HOST
                      value: "redis"
                    - name: OWNCLOUD_MAIL_DOMAIN
                      value: "rabe.ch"
                    - name: OWNCLOUD_MAIL_FROM_ADDRESS
                      value: "noreply"
                    - name: OWNCLOUD_MAIL_SMTPMODE
                      value: "smtp"
                    - name: OWNCLOUD_MAIL_SMTPSECURE
                      value: "ssl"
                    - name: OWNCLOUD_MAIL_SMTPAUTHTYPE
                      value: "PLAIN"
                    - name: OWNCLOUD_MAIL_SMTPAUTH
                      value: "1"
                    - name: OWNCLOUD_MAIL_SMTPHOST
                      value: "{{ '{{' }} owncloud_mail_smtp_host {{ '}}' }}"
                    - name: OWNCLOUD_MAIL_SMTPPORT
                      value: "465"
                    - name: OWNCLOUD_MAIL_SMTPNAME
                      value: "{{ '{{' }} owncloud_mail_smtp_name {{ '}}' }}"
                    - name: OWNCLOUD_MAIL_SMTPPASSWORD
                      value: "{{ '{{' }} owncloud_mail_smtp_password {{ '}}' }}"
                    - name: OWNCLOUD_HTTP_COOKIE_SAMESITE
                      value: "None"
                    - name: OWNCLOUD_OIDC_PROVIDER_URL
                      value: "https://sso.rabe.ch/auth/realms/rabe"
                    - name: OWNCLOUD_OIDC_CLIENT_ID
                      value: "{{ '{{' }} owncloud_oidc_client_id {{ '}}' }}"
                    - name: OWNCLOUD_OIDC_CLIENT_SECRET
                      value: "{{ '{{' }} owncloud_oidc_client_secret {{ '}}' }}"
                    - name: OWNCLOUD_OIDC_AUTO_REDIRECT_ON_LOGIN_PAGE
                      value: "true"
                    - name: OWNCLOUD_OIDC_MODE
                      value: "userid"
                    - name: OWNCLOUD_OIDC_SEARCH_ATTRIBUTE
                      value: "unixUID"
                    - name: OWNCLOUD_OIDC_POST_LOGOUT_REDIRECT_URI
                      value: "https://www.rabe.ch"
                    - name: OWNCLOUD_SOCIAL_LOGIN_AUTO_REDIRECT
                      value: "true"
                    - name: OWNCLOUD_SINGLE_LOGOUT_REDIRECT_URL
                      value: "https://sso.rabe.ch/auth/realms/rabe/protocol/openid-connect/logout?redirect_uri=https%3A%2F%2Frabe.ch"
              volumes:
                - name: owncloud_data
                  hostPath:
                    path: "/srv/tier2-owncloud-users-01"
                    type: Directory
                - name: httpd_tls_cert
                  hostPath:
                    path: /etc/pki/tls/certs/vm-0029.crt
                    type: File
                - name: httpd_tls_key
                  hostPath:
                    path: /etc/pki/tls/private/vm-0029.key
                    type: File
                - name: local_httpd_configs
                  hostPath:
                    path: "/home/{{ '{{' }} podman_run_as_user {{ '}}' }}/httpd/conf.d/local_configs"
    - name: podman_run_as_group
      parameter_type: string
      value: owncloud
    - name: podman_run_as_user
      parameter_type: string
      value: owncloud
    - name: podman_selinux_ports
      parameter_type: yaml
      value:
        - ports: 80
          setype: http_port_t
        - ports: 443
          setype: http_port_t
    - name: selinux_booleans
      parameter_type: yaml
      value:
        - name: container_read_certs
          state: true
          persistent: true
    - name: selinux_fcontexts
      parameter_type: yaml
      value:
        - target: /etc/certmonger/post-scripts(/.*)?
          setype: certmonger_unconfined_exec_t
          ftype: f
          state: present
    - name: selinux_restore_dirs
      parameter_type: yaml
      value:
        - /etc/certmonger/post-scripts/
    - name: zabbix_monitoring_podman_user
      parameter_type: string
      value: "{{ '{{' }} podman_run_as_user {{ '}}' }}"
    - name: radiorabe_copies
      parameter_type: yaml
      value:
        - dest: "/home/{{ '{{' }} podman_run_as_user {{ '}}' }}/httpd/conf.d/local_configs/vhost_vm-0029.service.int.rabe.ch.conf"
          mode: "0755"
          content: |-
            # This is the template we use at RaBe for VirtualHost configurations
            # -----------------------------------------------------------------------------
            # The aim is to have consistent configurations across the domains we serve
            # through the reverse proxies. There is a mandatory section "RaBe standard
            # section" which has to be the same in all configurations apart from domain
            # specifics. A second part "Custom configuration section" contains the
            # individual web service configuration. There is no individual web service
            # configuration section in VirtualHost for port 8080. We do not serve any
            # service unencrypted.
            #
            # 2025-09-02: initial version
            # HTTP & HTTPS virtual host vm-0029.service.int.rabe.ch
            #
            # This virtual host is used for OwnCloud service. It is configured to use
            # SSL/TLS with a certificate issued by the internal CA. The configuration
            # includes proxy settings to forward requests to the backend OwnCloud
            # container, as well as security headers to enhance privacy and security.
            #
            # See also:
            # * https://wiki.rabe.ch/vm-0029
            #
            <VirtualHost *:8444>
                #
                # ----- BEGIN RaBe standard section -----
                # Only adjust domain specifics marked with <<<>>> in this section.
                #

                # Set the DNS server name for this virtualhost
                # see https://httpd.apache.org/docs/2.4/mod/core.html#servername
                # and https://httpd.apache.org/docs/2.4/mod/core.html#serveralias
                #
                ServerName vm-0029.service.int.rabe.ch
                # ServerAlias <<<2ndsite/subdomain>>>.rabe.ch

                # SSL/TLS certificate configuration
                # see https://httpd.apache.org/docs/2.4/mod/mod_ssl.html
                #
                SSLEngine On

                # Cipher Suite available for negotiation in SSL proxy handshake
                # see https://httpd.apache.org/docs/2.4/mod/mod_ssl.html#sslproxyciphersuite
                # By default, RHEL cryptographic policiy SYSTEM is set.
                # More details at https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/security_hardening/using-the-system-wide-cryptographic-policies_security-hardening#system-wide-crypto-policies_using-the-system-wide-cryptographic-policies
                #
                # SSLCipherSuite PROFILE=SYSTEM

                # Server PEM-encoded X.509 certificate data files
                # see https://httpd.apache.org/docs/2.4/mod/mod_ssl.html#sslcertificatefile
                #
                SSLCertificateFile /etc/pki/tls/certs/server.crt
                SSLCertificateKeyFile /etc/pki/tls/private/server.key
                SSLCACertificatePath /etc/pki/tls/certs/
                #SSLCertificateChainFile /etc/pki/tls/private/rabe_certs/board.rabe.ch/chain.pem

                # Enable SSL/TLS requests forwarding to backend server
                # see https://httpd.apache.org/docs/2.4/mod/mod_ssl.html#sslproxyengine
                #
                SSLProxyEngine On
                SSLProxyCACertificateFile /etc/ssl/certs/ca-bundle.crt

                # Cipher Suite available for negotiation in SSL handshake
                # see https://httpd.apache.org/docs/2.4/mod/mod_ssl.html#sslciphersuite
                # By default, RHEL cryptographic policiy SYSTEM is set.
                # More details at https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/security_hardening/using-the-system-wide-cryptographic-policies_security-hardening#system-wide-crypto-policies_using-the-system-wide-cryptographic-policies
                #
                # SSLProxyCipherSuite PROFILE=SYSTEM

                # Enable SSL/TLS certificate verification of the remote server
                # see https://httpd.apache.org/docs/2.4/mod/mod_ssl.html#sslproxyverify
                #
                SSLProxyVerify require

                # Proxying to backend server configuration
                # see https://httpd.apache.org/docs/2.4/mod/mod_proxy.html
                #
                ProxyAddHeaders On
                ProxyPass / http://owncloud:8080/
                ProxyPassReverse / http://owncloud:8080/

                # Remove some headers giving away product information from response
                # see https://httpd.apache.org/docs/current/mod/mod_headers.html
                #
                Header unset Server
                Header unset X-Powered-By

                #
                # ----- END RaBe standard section -----
                #

                #
                # ----- BEGIN Custom configuration section -----
                # Add additional service specific configuration below.
                #

                # Turn off modsecurity for this virtual host, as it may
                # interfere with ownCloud functionality. Modsecurity is
                # enabled in the reverse proxy so this is only for the
                # backend container.
                # see https://httpd.apache.org/docs/current/mod/mod_security2.html
                SecRuleEngine Off

                #
                # ----- END Custom configuration section -----
                #
            </VirtualHost>

            <VirtualHost *:8081>
                #
                # ----- BEGIN RaBe standard section -----
                # Only adjust domain specifics marked with <<<>>> in this section.
                #

                # Set the DNS server name for this virtualhost
                # see https://httpd.apache.org/docs/2.4/mod/core.html#servername
                # and https://httpd.apache.org/docs/2.4/mod/core.html#serveralias
                #
                ServerName vm-0029.service.int.rabe.ch
                # ServerAlias <<<2ndsite/subdomain>>>.rabe.ch

                # HTTP to HTTPS redirect
                # see https://httpd.apache.org/docs/current/mod/mod_rewrite.html
                #
                RewriteEngine On
                RewriteCond %{HTTPS} off
                RewriteRule (.*) https://%{SERVER_NAME}$1 [R,L]
            </VirtualHost>
